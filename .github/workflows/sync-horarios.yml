name: Sincronizar horarios.json com ialxnder

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buscar horarios.json do ialxnder
        run: curl -fsSL "https://ialxnder.fly.dev/v1/horarios" -o data/horarios.json

      - name: Detectar mudanças
        id: diff
        run: |
          if git diff --quiet -- data/horarios.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit e push se houve mudança
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/horarios.json
          git commit -m "chore: sincronizar horarios.json com ialxnder"
          git push origin HEAD:main
